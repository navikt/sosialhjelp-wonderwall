name: "Deploy Wonderwall"

# Deployer alle miljøer ved merge til main når en wonderwall-fil er endret.
# Uendrede miljøer får samme manifest og ruller ikke ut nye pods.
# Digestabot sine merger trigger også denne workflowen, siden de gjøres med
# token fra GitHub-appen (se digestabot.yml).

on:
  push:
    branches:
      - main
    paths:
      - 'nais/*/wonderwall.yml'

permissions: {}

jobs:
  deploy-on-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ mock, preprod, prod ]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: "Set cluster based on env"
        env:
          ENV: ${{ matrix.env }}
        run: |
          if [ "$ENV" = "prod" ]; then
            echo "CLUSTER=prod-gcp" >> "$GITHUB_ENV"
          else
            echo "CLUSTER=dev-gcp" >> "$GITHUB_ENV"
          fi

      - name: "Deploy ${{ matrix.env }} to ${{ env.CLUSTER }}"
        uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          RESOURCE: nais/${{ matrix.env }}/wonderwall.yml
          CLUSTER: ${{ env.CLUSTER }}
          REF: ${{ github.sha }}
          PRINT_PAYLOAD: true
