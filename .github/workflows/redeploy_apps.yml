name: "Redeploy Wonderwall"

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-wonderwall:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ mock, preprod, prod ]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: "Set cluster based on env"
        run: |
          if [ "${{ matrix.env }}" = "prod" ]; then
            echo "CLUSTER=prod-gcp" >> $GITHUB_ENV
          else
            echo "CLUSTER=dev-gcp" >> $GITHUB_ENV
          fi

      - name: "Deploy ${{ matrix.env }} to ${{ env.CLUSTER }}"
        uses: nais/deploy/actions/deploy@v2
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          RESOURCE: nais/${{ matrix.env }}/wonderwall.yml
          CLUSTER: ${{ env.CLUSTER }}
          REF: ${{ github.sha }}
          PRINT_PAYLOAD: true
  deploy-idporten-mock:
    uses: ./.github/workflows/deploy-mock-idporten.yml
    secrets: inherit
  deploy-texas-mock:
    uses: ./.github/workflows/deploy-texas-mock.yml
    secrets: inherit
